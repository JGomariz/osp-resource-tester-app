# Runs on every push and pull request, so a regression is found when it is
# introduced rather than when someone tries to cut a release.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Types and Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust tests
    # macOS rather than ubuntu: on Linux the tauri crate links GTK and
    # webkit2gtk, so testing there means maintaining an apt list for a
    # platform this app is never shipped on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Only the downloaded crates, never `src-tauri/target` — the same rule
      # release.yml follows, and for the same reason: a target directory runs
      # to gigabytes, and a fresh entry per push would spend the 10 GB
      # repo-wide budget evicting everything else to save a compile. Keyed on
      # the lockfile with no commit component, because the crates for a given
      # lockfile do not change: an exact hit every time is the point.
      - name: Cache the crate registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: crates-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: crates-${{ runner.os }}-
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # The release workflow's packaging path would otherwise first run on a tag,
  # when it is most expensive to be wrong — and the Windows half cannot be
  # built on a maintainer's machine at all, which is why ADR-0001 accepts
  # CI-built releases. So the exact release build runs here too, and asserts
  # the binary lands where the release workflow will look for it. Nothing is
  # packaged or published; this only proves the path exists.
  windows-binary:
    name: Windows binary builds
    # Pull requests skip it: it is the one job here that costs a Windows
    # runner, and it guards a release rather than a review.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Registry only. This job does a *release* build, which is exactly the
      # case release.yml refuses to cache the target directory for.
      - name: Cache the crate registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: crates-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: crates-${{ runner.os }}-
      - run: npm ci
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build the portable exe
        run: npm run tauri -- build --no-bundle
      - name: Check the exe is where the release expects it
        run: |
          $exe = "src-tauri/target/release/resource-tester.exe"
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
