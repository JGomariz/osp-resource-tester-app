[package]
name = "resource-tester"
version = "1.0.0"
description = "Probador de Recursos — comprueba recursos de backend en entornos no productivos"
edition = "2021"

[lib]
name = "resource_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
